name: otari-debug
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Curl models endpoint
        env:
          LLM_API_KEY: ${{ secrets.OTARI_API_KEY }}
        run: |
          echo "key length: ${#LLM_API_KEY}"
          case "$LLM_API_KEY" in otk_*) echo "key prefix: otk_ OK";; *) echo "key prefix: UNEXPECTED";; esac
          curl -s -m 30 -o /tmp/models.json -w "models HTTP: %{http_code}\n" \
            https://api.otari.ai/api/v1/models \
            -H "Authorization: Bearer $LLM_API_KEY"
          head -c 300 /tmp/models.json; echo

      - name: Curl chat completion
        env:
          LLM_API_KEY: ${{ secrets.OTARI_API_KEY }}
        run: |
          curl -s -m 60 -w "\nchat HTTP: %{http_code}\n" \
            https://api.otari.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"deepseek/deepseek-v4-pro-0813","messages":[{"role":"user","content":"Reply with exactly: OK"}],"max_tokens":5}' | head -c 600; echo

      - name: Python SDK chat completion
        env:
          LLM_API_KEY: ${{ secrets.OTARI_API_KEY }}
        run: |
          pip install -q openai
          python3 - <<'EOF'
          import os, traceback
          from openai import OpenAI
          c = OpenAI(base_url="https://api.otari.ai/api/v1",
                     api_key=os.environ["LLM_API_KEY"])
          try:
              r = c.chat.completions.create(
                  model="deepseek/deepseek-v4-pro-0813",
                  messages=[{"role": "user", "content": "Reply with exactly: OK"}],
                  max_tokens=5)
              print("SDK OK:", r.choices[0].message.content)
          except Exception as e:
              print("SDK ERROR:", type(e).__name__, e)
              resp = getattr(e, "response", None)
              if resp is not None:
                  print("status:", resp.status_code)
                  print("headers:", dict(resp.headers))
                  print("body:", resp.text[:600])
          EOF
