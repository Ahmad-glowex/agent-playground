name: otari-debug
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Backtick micro-bisect
        env:
          LLM_API_KEY: ${{ secrets.OTARI_API_KEY }}
        run: |
          pip install -q openai
          python3 - <<'EOF'
          import os, sys
          os.environ.setdefault("AGENT_TASK", "debug")
          os.environ.setdefault("AGENT_REPO", ".")
          sys.path.insert(0, ".github/agent")
          from openai import OpenAI
          import run as agent_run

          client = OpenAI(base_url="https://api.otari.ai/api/v1",
                          api_key=os.environ["LLM_API_KEY"])
          system = open(".github/agent/AGENT.md").read()
          variants = [
              ("m1_backticked_call", "Please look at `total()` in the code."),
              ("m2_bare_call", "Please look at total() in the code."),
              ("m3_backticked_path", "Please look at `app/calc.py` today."),
              ("m4_backticked_args", "Check `total([1, 2, 3])` please."),
              ("m5_backticked_shell", "Now run `ls -la` for me."),
              ("m6_plain_args", "Check total([1, 2, 3]) please."),
          ]
          for name, user in variants:
              try:
                  client.chat.completions.create(
                      model="deepseek/deepseek-v4-pro-0813",
                      messages=[{"role": "system", "content": system},
                                {"role": "user", "content": user}],
                      tools=agent_run.TOOLS, tool_choice="auto",
                      temperature=0.2, max_tokens=50)
                  print(name, "-> OK")
              except Exception as e:
                  print(name, "-> ERROR:", type(e).__name__)
          EOF
