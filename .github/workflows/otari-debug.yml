name: otari-debug
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_BASE_URL: https://api.otari.ai/api/v1
      LLM_API_KEY: ${{ secrets.OTARI_API_KEY }}
      LLM_MODEL: deepseek/deepseek-v4-pro-0813
      LLM_FALLBACK_MODEL: bedrock:amazon.nova-lite-v1:0
    steps:
      - uses: actions/checkout@v4
      - name: Run the real agent entrypoint with the real issue text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q openai
          gh issue view 3 --json title,body \
            --jq '"\(.title)\n\n\(.body)"' > /tmp/task.md
          echo "--- task word count: $(wc -w < /tmp/task.md)"
          AGENT_TASK="$(cat /tmp/task.md)" AGENT_MAX_STEPS=2 \
            python3 .github/agent/run.py 2>&1 | tail -15
